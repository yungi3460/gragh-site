<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Graph App</title>

<style>
body { margin:0; display:flex; font-family:Arial; }

#menu {
  width:220px;
  background:#2c2c2c;
  color:white;
  padding:10px;
}

button {
  width:100%;
  padding:8px;
  margin-top:5px;
  background:#444;
  color:white;
  border:none;
  cursor:pointer;
}

canvas { flex:1; cursor:grab; touch-action:none; }
canvas:active { cursor:grabbing; }

#panel {
  width:260px;
  background:#f4f4f4;
  padding:10px;
}

input { width:100%; padding:8px; margin-top:8px; }

#info {
  margin-top:15px;
  background:white;
  padding:10px;
  border:1px solid #ccc;
}

#zoomControls {
  position:fixed;
  bottom:10px;
  right:10px;
  display:flex;
  gap:5px;
}

#zoomControls button {
  width:50px;
  height:50px;
  font-size:20px;
  background:black;
  color:white;
  border:none;
}
</style>
</head>

<body>

<div id="menu">
  <h3>기본 공식</h3>
  <button onclick="addFunc('x')">y=x</button>
  <button onclick="addFunc('x^2')">y=x²</button>
  <button onclick="addFunc('sin(x)')">sin(x)</button>

  <h3>고급</h3>
  <button onclick="addDerivative()">미분</button>
  <button onclick="togglePoints()">접점 표시 ON/OFF</button>
  <button onclick="removeLast()">그래프 삭제</button>
  <button onclick="resetAll()">전체 초기화</button>
</div>

<canvas id="graph"></canvas>

<div id="panel">
  <h3>함수 입력</h3>
  <input id="input" placeholder="예: -2x^2 + 3/2x 또는 sin x">
  <button onclick="addInput()">그래프 추가</button>

  <div id="info">그래프 정보 없음</div>
</div>

<div id="zoomControls">
  <button onclick="zoomIn()">+</button>
  <button onclick="zoomOut()">−</button>
</div>

<script>
// 👉 JS는 이전 코드 그대로 붙이면 됨
// (너가 쓰던 전체 JS 코드 그대로 여기 넣어)
</script>

</body>
</html>
